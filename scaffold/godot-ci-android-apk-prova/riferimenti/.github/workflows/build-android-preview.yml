name: Android APK di prova

# APK di debug da scaricare dalla pagina dell'esecuzione (Artifacts), senza tag e senza
# release. Solo manuale (Actions -> Run workflow), anche su un branch di lavoro.
# Firmato con la chiave di debug standard di Android (pubblica, non e un segreto):
# non va caricato su Google Play.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_PATH: "Godot"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Godot ${{ env.GODOT_VERSION }} Mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      # La chiave di debug standard viene creata nel runner: non serve tenerla nel repo
      - name: Crea la chiave di debug e configura Godot
        run: |
          mkdir -p ~/.config/godot ~/.gradle "$RUNNER_TEMP/keys"
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          KEYSTORE_ABS="$RUNNER_TEMP/keys/debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE_ABS" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${KEYSTORE_ABS}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = false
          EOF
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres

      - name: Build APK Android
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          mkdir -p Builds/Android
          # la versione esatta, mostrata in un angolo del gioco (Scripts/Core/BuildInfo.cs)
          VERSION="debug-${{ github.run_number }} ${GITHUB_SHA::7} $(date -u '+%d/%m %H:%M') UTC"
          sed -i "s|Version = \"dev\"|Version = \"${VERSION}\"|" Scripts/Core/BuildInfo.cs
          grep -n "Version =" Scripts/Core/BuildInfo.cs
          godot --headless --install-android-build-template --export-debug "Android" Builds/Android/APP_PROJECT.apk 2>&1

      - name: Verifica che l'APK esista
        run: |
          APK_PATH="${{ env.PROJECT_PATH }}/Builds/Android/APP_PROJECT.apk"
          test -f "$APK_PATH" || { echo "::error::APK non trovato: $APK_PATH"; exit 1; }
          du -h "$APK_PATH"

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: APP_PROJECT-debug-${{ github.run_number }}
          path: ${{ env.PROJECT_PATH }}/Builds/Android/APP_PROJECT.apk
          retention-days: 14

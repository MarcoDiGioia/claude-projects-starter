name: Pubblica wiki

# Solo manuale: genera le pagine da moduli/ e docs/ e le pubblica nella wiki GitHub del repository.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Genera le pagine
        run: scripts/genera-wiki.sh "$RUNNER_TEMP/wiki-nuova"

      - name: Pubblica nella wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP"/wiki-nuova/*.md .
          git add -A
          if git diff --cached --quiet; then
            echo "La wiki è già aggiornata."
            exit 0
          fi
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Aggiorna la wiki da ${GITHUB_SHA::7}"
          git push

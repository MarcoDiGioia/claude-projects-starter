name: Android AAB per Google Play

# Costruisce l'app bundle (.aab) firmato con la chiave di UPLOAD e lo carica sulla
# traccia di TEST INTERNO di Google Play. Solo manuale (Actions -> Run workflow):
# i minuti di Actions sono pochi. Se il secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
# manca, l'AAB resta solo tra gli artifact, da caricare a mano nella Play Console.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nome versione mostrato agli utenti (es. 0.1.0). Vuoto: 0.1.<numero esecuzione>'
        required: false
        default: ''
        type: string
      upload:
        description: 'Carica su Google Play (traccia interna) se il secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON e presente'
        required: true
        default: true
        type: boolean

concurrency:
  group: play-store-aab
  cancel-in-progress: false

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_PATH: "Godot"
  PACKAGE_NAME: "APP_PACKAGE_ID"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Controlla i secret prima di perdere tempo nella build
      - name: Verifica i secret della chiave di upload
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_ALIAS KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Manca il secret per $name (vedi moduli/godot-ci-android-aab-play/modulo.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Godot ${{ env.GODOT_VERSION }} Mono
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      # Chiave di upload: sta solo nel runner, mai nel repo
      - name: Ricostruisci il keystore di upload
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Configura Godot Editor Settings per Android
        run: |
          mkdir -p ~/.config/godot ~/.gradle
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = false
          EOF
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres

      # Il version code deve crescere a ogni caricamento su Play: si usa il numero di
      # esecuzione. L'export diventa un AAB (export_format=1) solo nel runner.
      - name: Imposta versione e formato AAB
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="${{ inputs.version_name }}"
          [ -n "$VERSION_NAME" ] || VERSION_NAME="0.1.${{ github.run_number }}"
          sed -i "s|^version/code=.*|version/code=${VERSION_CODE}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"${VERSION_NAME}\"|" export_presets.cfg
          sed -i "s|^gradle_build/export_format=.*|gradle_build/export_format=1|" export_presets.cfg
          grep -n '^version/\|^gradle_build/export_format\|^package/unique_name' export_presets.cfg

      - name: Build AAB di release
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          mkdir -p Builds/Android
          godot --headless --install-android-build-template --export-release "Android" Builds/Android/APP_PROJECT.aab 2>&1

      - name: Verifica firma e package
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          AAB=Builds/Android/APP_PROJECT.aab
          test -f "$AAB" || { echo "::error::AAB non trovato"; exit 1; }
          du -h "$AAB"
          jarsigner -verify "$AAB" | head -3
          if jarsigner -verify -verbose -certs "$AAB" | grep -qi 'CN=Android Debug'; then
            echo "::error::L'AAB e firmato con la chiave di debug: Play lo rifiuterebbe"
            exit 1
          fi
          if unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -q "$PACKAGE_NAME"; then
            echo "Package $PACKAGE_NAME presente nel manifest"
          else
            echo "::warning::Package $PACKAGE_NAME non trovato nel manifest (controllo euristico, verificare a mano)"
          fi

      - name: Salva l'AAB come artifact
        uses: actions/upload-artifact@v4
        with:
          name: APP_PROJECT-aab-${{ github.run_number }}
          path: ${{ env.PROJECT_PATH }}/Builds/Android/APP_PROJECT.aab
          if-no-files-found: error

      # Il primo caricamento di un'app nuova va fatto a mano nella Play Console
      - name: Controlla se c'e l'account di servizio di Google Play
        id: play
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nessun GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: l'AAB resta negli artifact, da caricare a mano nella Play Console"
          fi

      - name: Carica su Google Play (test interno)
        if: ${{ inputs.upload && steps.play.outputs.enabled == 'true' }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.PROJECT_PATH }}/Builds/Android/APP_PROJECT.aab
          track: internal
          status: completed
